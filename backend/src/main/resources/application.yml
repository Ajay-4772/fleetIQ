server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: vehyron-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:h2:mem:vehyron;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: W3C,B3
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:vehyron-backend},%X{traceId:-},%X{spanId:-}]"

vehyron:
  seed:
    enabled: ${VEHYRON_SEED_ENABLED:false}
  jev:
    enabled: ${JEV_API_ENABLED:false}
    api-url: ${JEV_API_URL:https://api.jev.ai/v1/decisions}
    api-key: ${JEV_API_KEY:}
    timeout-ms: ${JEV_TIMEOUT_MS:3000}
    confidence-threshold: ${JEV_CONFIDENCE_THRESHOLD:0.80}
    fallback-enabled: true
  simulator:
    default-seed: ${SIMULATOR_DEFAULT_SEED:20260925}
    default-vehicle-count: ${SIMULATOR_DEFAULT_VEHICLE_COUNT:60}
    default-event-count: ${SIMULATOR_DEFAULT_EVENT_COUNT:100}
  security:
    jwt:
      secret: ${JWT_SECRET:VehyronSecretKeyForJWTSigningMustBeAtLeast256BitsLongForHMACSHA256Secure}
    ingestion-api-key: ${VEHYRON_INGESTION_API_KEY:vehyron-ingest-secure-key-2026}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vehyron}
    username: ${DB_USER:vehyron_user}
    password: ${DB_PASSWORD:vehyron_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_MAX_LIFETIME:1200000}
      leak-detection-threshold: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
