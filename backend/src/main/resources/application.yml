server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: fleetiq-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:h2:mem:fleetiq;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: W3C,B3
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [${spring.application.name:fleetiq-backend},%X{traceId:-},%X{spanId:-}]"

fleetiq:
  jev:
    enabled: ${JEV_API_ENABLED:false}
    api-url: ${JEV_API_URL:https://api.jev.ai/v1/decisions}
    api-key: ${JEV_API_KEY:}
    timeout-ms: ${JEV_TIMEOUT_MS:3000}
    confidence-threshold: ${JEV_CONFIDENCE_THRESHOLD:0.80}
    fallback-enabled: true
  simulator:
    default-seed: ${SIMULATOR_DEFAULT_SEED:20260925}
    default-vehicle-count: ${SIMULATOR_DEFAULT_VEHICLE_COUNT:60}
    default-event-count: ${SIMULATOR_DEFAULT_EVENT_COUNT:100}
  security:
    jwt:
      secret: ${JWT_SECRET:FleetIQSecretKeyForJWTSigningMustBeAtLeast256BitsLongForHMACSHA256Secure}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    ingestion-api-key: ${FLEETIQ_INGESTION_API_KEY:fleetiq-ingest-secure-key-2026}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fleetiq}
    username: ${DB_USER:fleetiq_user}
    password: ${DB_PASSWORD:fleetiq_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
