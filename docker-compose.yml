name: vehyron

services:
  postgres:
    image: postgres:15-alpine
    container_name: vehyron-postgres
    environment:
      POSTGRES_DB: vehyron
      POSTGRES_USER: vehyron_user
      POSTGRES_PASSWORD: vehyron_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehyron_user -d vehyron"]
      interval: 5s
      timeout: 5s
      retries: 5

  vehyron-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vehyron-backend:latest
    container_name: vehyron-backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres,dev
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-VehyronRootAdmin@2026!}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vehyron
      DB_USER: vehyron_user
      DB_PASSWORD: vehyron_secret
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  vehyron-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vehyron-frontend:latest
    container_name: vehyron-frontend
    ports:
      - "5173:80"
    depends_on:
      - vehyron-backend

volumes:
  postgres_data:
