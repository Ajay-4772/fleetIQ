version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fleetiq-postgres
    environment:
      POSTGRES_DB: fleetiq
      POSTGRES_USER: fleetiq_user
      POSTGRES_PASSWORD: fleetiq_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetiq_user -d fleetiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  fleetiq-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetiq-backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fleetiq
      DB_USER: fleetiq_user
      DB_PASSWORD: fleetiq_secret
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  fleetiq-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fleetiq-frontend
    ports:
      - "5173:80"
    depends_on:
      - fleetiq-backend

volumes:
  postgres_data:
