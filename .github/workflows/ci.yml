name: VEHYRON Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test-and-build:
    name: Backend Test & Verification (Java 17 / Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile & Run Backend Test Suites
        run: mvn -B clean test -f backend/pom.xml

      - name: Build Backend Production Package
        run: mvn -B package -DskipTests -f backend/pom.xml

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend-test-and-build:
    name: Frontend Build & Typecheck (Vite / React / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Run TypeScript Verification & Production Bundle Build
        run: npm run build --prefix frontend

  docker-image-validation:
    name: Container Packaging & Compose Verification
    needs: [backend-test-and-build, frontend-test-and-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Build Backend Container
        run: docker build -t vehyron/backend:ci -f backend/Dockerfile backend/

      - name: Build Frontend Container
        run: docker build -t vehyron/frontend:ci -f frontend/Dockerfile frontend/
